services:
  db:
    image: postgres:16-alpine
    container_name: primarywms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: primarywms
      POSTGRES_PASSWORD: primarywms
      POSTGRES_DB: primarywms
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primarywms -d primarywms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: primarywms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: primarywms
      MINIO_ROOT_PASSWORD: primarywmssecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
